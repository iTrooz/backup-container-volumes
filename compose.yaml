services:
  volumes-backup:
    container_name: restic-backup
    image: ghcr.io/itrooz/restic-backup-server:latest
    restart: unless-stopped
    build:
      dockerfile: ./Containerfile
    environment: # Complete env in compose.override.yaml
      - CRON_SCHEDULE=5 0 * * * # backup every day at 00:05
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
